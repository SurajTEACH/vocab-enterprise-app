spring.application.name=vocab-learning-backend
server.port=${PORT:8085}

# Primary Data Source (Automatic Cloud MySQL with In-Memory Safe Fallback)
# When SPRING_DATASOURCE_URL is provided (Cloud MySQL), it uses your cloud database.
# When not set, it starts safely with in-memory database so the app is immediately LIVE!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:Ward_Boost_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (Disabled by default in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# OpenAPI Swagger Docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Configuration
logging.level.org.springframework.security=INFO

# Request and Multipart Size Limits (for Base64 Profile Pictures)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

